[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kvlab"
version = "0.1.0"
description = "大模型推理状态管理与数据访问优化实验平台"
requires-python = ">=3.11"
dependencies = [
  "torch==2.8.0", "transformers==4.57.1", "numpy==2.3.4",
  "matplotlib==3.10.7", "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
kvlab = "kvlab.cli:main"

[tool.setuptools.packages.find]
include = ["kvlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
